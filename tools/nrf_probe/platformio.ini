; Sketch autonome : trouve sur quelles broches le NRF24L01 est branché.
; Usage : pio run -t upload && pio device monitor
[env:m5stick-c-plus2]
platform = espressif32@^6.9.0
board = m5stick-c
framework = arduino
board_upload.flash_size = 8MB
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.2.2
