<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 660" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="320" height="660" fill="#f0f0f3"/>
  <rect x="8" y="8" width="304" height="644" rx="44" fill="#0b0b0f"/>
  <rect x="18" y="18" width="284" height="624" rx="34" fill="#f2f2f7"/>
  <rect x="120" y="26" width="80" height="18" rx="9" fill="#0b0b0f"/>
  <text x="40" y="44" font-size="13" font-weight="700" fill="#111827">9:41</text>

  <text x="30" y="96" font-size="24" font-weight="800" fill="#111827">Spectre 2,4 GHz</text>

  <rect x="22" y="120" width="260" height="250" rx="12" fill="#ffffff"/>
  <text x="34" y="142" font-size="12" font-weight="600" fill="#111827">Dernier balayage</text>
  <text x="270" y="142" text-anchor="end" font-size="10" fill="#8e8e93">reçu à l'instant</text>

  <!-- bandes Wi-Fi -->
  <rect x="46" y="156" width="40" height="144" fill="#2563eb" opacity="0.08"/>
  <rect x="91" y="156" width="41" height="144" fill="#2563eb" opacity="0.08"/>
  <rect x="137" y="156" width="40" height="144" fill="#2563eb" opacity="0.08"/>
  <g font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">
    <text x="66" y="166">1</text><text x="111" y="166">6</text><text x="157" y="166">11</text>
  </g>

  <!-- axes -->
  <line x1="44" y1="300" x2="272" y2="300" stroke="#d1d1d6"/>
  <g font-size="9" fill="#aeaeb2" text-anchor="end">
    <text x="40" y="303">0</text><text x="40" y="228">50</text><text x="40" y="153">100%</text>
  </g>

  <!-- barres (occupation %) -->
  <g>
    <rect x="47" y="273" width="6" height="27" fill="#34c759"/>
    <rect x="57" y="255" width="6" height="45" fill="#34c759"/>
    <rect x="63" y="192" width="6" height="108" fill="#ff9f0a"/>
    <rect x="69" y="217" width="6" height="83" fill="#ff9f0a"/>
    <rect x="79" y="270" width="6" height="30" fill="#34c759"/>
    <rect x="89" y="252" width="6" height="48" fill="#34c759"/>
    <rect x="99" y="240" width="6" height="60" fill="#34c759"/>
    <rect x="109" y="168" width="6" height="132" fill="#ff3b30"/>
    <rect x="115" y="158" width="6" height="142" fill="#ff3b30"/>
    <rect x="125" y="210" width="6" height="90" fill="#ff9f0a"/>
    <rect x="135" y="265" width="6" height="35" fill="#34c759"/>
    <rect x="145" y="255" width="6" height="45" fill="#34c759"/>
    <rect x="155" y="228" width="6" height="72" fill="#34c759"/>
    <rect x="165" y="195" width="6" height="105" fill="#ff9f0a"/>
    <rect x="171" y="207" width="6" height="93" fill="#ff9f0a"/>
    <rect x="181" y="267" width="6" height="33" fill="#34c759"/>
    <rect x="191" y="243" width="6" height="57" fill="#34c759"/>
    <rect x="201" y="276" width="6" height="24" fill="#34c759"/>
    <rect x="211" y="261" width="6" height="39" fill="#34c759"/>
    <rect x="224" y="279" width="6" height="21" fill="#34c759"/>
    <rect x="240" y="282" width="6" height="18" fill="#34c759"/>
    <rect x="256" y="285" width="6" height="15" fill="#34c759"/>
  </g>

  <g font-size="9" fill="#aeaeb2">
    <text x="44" y="315">2400</text><text x="272" y="315" text-anchor="end">2525 MHz</text>
  </g>

  <text x="30" y="394" font-size="11" fill="#8e8e93">Hauteur = part du temps où le canal</text>
  <text x="30" y="409" font-size="11" fill="#8e8e93">est occupé. Repères Wi-Fi 1 / 6 / 11.</text>

  <!-- barre d'onglets -->
  <line x1="18" y1="610" x2="302" y2="610" stroke="#d9d9de"/>
  <g font-size="9" text-anchor="middle">
    <text x="46" y="632" fill="#8e8e93">Direct</text>
    <text x="104" y="632" fill="#8e8e93">Carte</text>
    <text x="160" y="632" fill="#8e8e93">Liste</text>
    <text x="220" y="632" fill="#0a84ff" font-weight="700">Spectre</text>
    <text x="276" y="632" fill="#8e8e93">Plus</text>
  </g>
</svg>
